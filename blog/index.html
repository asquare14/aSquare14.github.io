---
layout: page
title: Archive
description: Posts from 2018–2020. New writing lives on Substack.
---
<p><a class="btn" href="https://{{ site.substack }}.substack.com">Read on Substack ↗</a></p>
<ul class="rows simple archive">
  {%- for post in site.posts %}
  {%- unless post.hidden %}
  <li><a class="t" href="{{ post.url | relative_url }}">{{ post.title }}</a><span class="r">{{ post.date | date: "%Y" }}</span></li>
  {%- endunless %}
  {%- endfor %}
</ul>
