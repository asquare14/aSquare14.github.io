---
layout: page
title: Tags
---
{%- for tag in site.tags %}
<div class="tag-group">
  <h2 id="{{ tag[0] | slugify }}">{{ tag[0] }}</h2>
  <ul class="rows simple">
    {%- for post in tag[1] %}
    {%- if post.title %}
    <li><a class="t" href="{{ post.url | relative_url }}">{{ post.title }}</a><span class="r">{{ post.date | date: "%Y" }}</span></li>
    {%- endif %}
    {%- endfor %}
  </ul>
</div>
{%- endfor %}
